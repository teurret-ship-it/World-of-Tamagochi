name: CI

# One job, the same gates as CLAUDE.md section 4. The GitHub runner ships an
# Android SDK, so this is the authoritative build even for sessions that can
# only run the JVM-only subset locally (ADR-002).
#
# Screenshots: references live in */src/test/screenshots and change only
# through a reviewed commit. When they are missing or differ, CI records the
# new images and pushes them to `screenshots/<branch>` for review (ADR-003).

on:
  push:
    branches: ['**', '!screenshots/**', '!dependabot/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Check (format, detekt, lint, unit tests, coverage)
        run: |
          set -o pipefail
          mkdir -p build
          ./gradlew check --continue 2>&1 | tee build/check.log

      - name: Screenshots
        id: shots
        run: |
          if ls */src/test/screenshots/*.png */*/src/test/screenshots/*.png >/dev/null 2>&1; then
            if ./gradlew verifyRoborazziDebug; then exit 0; fi
            echo "::error::Screenshots differ from the committed references."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No reference screenshots yet."
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi
          ./gradlew recordRoborazziDebug

      - name: Publish recorded screenshots for review
        # Pushes only: Dependabot and pull requests do not get screenshot branches.
        if: github.event_name == 'push' && (steps.shots.outputs.changed == 'true' || steps.shots.outputs.missing == 'true')
        run: |
          branch="screenshots/${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A -- '*src/test/screenshots/*.png'
          git commit -q -m "Screenshots recorded for ${GITHUB_SHA::7}" || echo "No screenshot changes"
          git push -f origin "$branch"
          echo "Recorded screenshots pushed to $branch"

      - name: Fail on screenshot differences
        if: steps.shots.outputs.changed == 'true'
        run: exit 1

      - name: Release build (R8)
        run: ./gradlew :app:assembleRelease

      - name: APK size budget
        run: scripts/check-apk-size.sh app/build/outputs/apk/release/app-release.apk

      # A phone-installable test build of every green main, at a fixed link:
      # github.com/<repo>/releases/tag/test-build (signed with the test key).
      - name: Publish test build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk world-of-tamagochi.apk
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build world-of-tamagochi.apk --prerelease --target "$GITHUB_SHA" \
            --title "Test build ${GITHUB_SHA::7}" \
            --notes "Latest green build of main (${GITHUB_SHA::7}). On Android: open this page on the phone, download world-of-tamagochi.apk, allow installing from this source, install. Offline build: online races appear once the server is deployed (ADR-008)."

      - name: Failure summary
        if: failure()
        run: scripts/ci-failure-summary.sh

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '**/build/reports/**'
          if-no-files-found: ignore
