# Builds upon detekt's default config; only deviations are listed here.
naming:
  FunctionNaming:
    # Composables are PascalCase by convention.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Za-z0-9]*'
complexity:
  TooManyFunctions:
    # Art files are many small drawing helpers by design.
    excludes: ['**/test/**', '**/*Art.kt']
  LongParameterList:
    ignoreAnnotated: ['Composable']
    # Test fixtures take one named parameter per need.
    excludes: ['**/test/**']
style:
  MaxLineLength:
    # Same limit as ktlint_official.
    maxLineLength: 140
  MagicNumber:
    # A named property or an enum table is already a named constant.
    ignorePropertyDeclaration: true
    ignoreEnums: true
    excludes: ['**/test/**', '**/designsystem/**', '**/*Art.kt']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
